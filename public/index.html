<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AI Chatbot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f5;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 650px;
      height: 750px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    /* Header */

    .header {
      height: 65px;
      padding: 0 20px;
      border-bottom: 1px solid #eee;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 38px;
      height: 38px;
      background: #111;
      color: white;
      border-radius: 10px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 19px;
    }

    .title h2 {
      margin: 0;
      font-size: 17px;
    }

    .title span {
      display: block;
      color: #888;
      font-size: 12px;
      margin-top: 2px;
    }

    #newChat {
      border: 1px solid #ddd;
      background: white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    #newChat:hover {
      background: #f5f5f5;
    }

    /* Messages */

    #messages {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
    }

    .welcome {
      text-align: center;
      color: #777;
      margin-top: 180px;
    }

    .welcome h3 {
      color: #222;
      margin-bottom: 8px;
    }

    .message-row {
      display: flex;
      margin-bottom: 18px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message {
      max-width: 75%;
      padding: 11px 15px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .message.user {
      background: #111;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.ai {
      background: #f1f1f1;
      color: #222;
      border-bottom-left-radius: 4px;
    }

    /* Input */

    .input-container {
      padding: 15px 18px;
      border-top: 1px solid #eee;
      background: white;
    }

    .input-box {
      display: flex;
      align-items: center;
      border: 1px solid #d5d5d5;
      border-radius: 11px;
      padding: 5px;
      transition: 0.2s;
    }

    .input-box:focus-within {
      border-color: #999;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.04);
    }

    #messageInput {
      flex: 1;
      border: none;
      outline: none;
      padding: 11px;
      font-size: 14px;
    }

    #sendButton {
      width: 40px;
      height: 40px;

      border: none;
      border-radius: 8px;

      background: #111;
      color: white;

      cursor: pointer;
      font-size: 17px;
    }

    #sendButton:hover {
      background: #333;
    }

    #sendButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .hint {
      text-align: center;
      color: #999;
      font-size: 11px;
      margin-top: 8px;
    }

    /* Mobile */

    @media (max-width: 700px) {
      body {
        background: white;
      }

      .chat-container {
        width: 100%;
        height: 100vh;
        border: none;
        border-radius: 0;
      }

      .message {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <!-- Header -->

    <div class="header">

      <div class="title">

        <div class="logo">
         ✦
        </div>

        <div>
          <h2>AI Assistant</h2>
          <span>ChatBot</span>
        </div>

      </div>

      <button id="newChat">
        + New Chat
      </button>

    </div>


    <!-- Messages -->

    <div id="messages">

      <div class="welcome" id="welcome">
        <h3>How can I help you?</h3>
        <p>Ask me anything to get started.</p>
      </div>

    </div>


    <!-- Input -->

    <div class="input-container">

      <div class="input-box">

        <input
          id="messageInput"
          type="text"
          placeholder="Message AI Assistant..."
          autocomplete="off"
        />

        <button id="sendButton">
          ↑
        </button>

      </div>

      <div class="hint">
        Press Enter to send
      </div>

    </div>

  </div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>

    const messages = document.getElementById("messages");

    const input = document.getElementById("messageInput");

    const sendButton = document.getElementById("sendButton");

    const newChatButton = document.getElementById("newChat");

    const welcome = document.getElementById("welcome");


    function addMessage(text, sender) {

      // Remove welcome screen
      if (welcome) {
        welcome.remove();
      }

      const row = document.createElement("div");

      row.classList.add("message-row");

      if (sender === "user") {
        row.classList.add("user");
      }


      const message = document.createElement("div");

      message.classList.add("message");
      message.classList.add(sender);

      message.textContent = text;


      row.appendChild(message);

      messages.appendChild(row);


      // Scroll to bottom

      messages.scrollTop = messages.scrollHeight;


      return message;

    }


    async function sendMessage() {

      const message = input.value.trim();

      if (!message) {
        return;
      }


      // Show user message

      addMessage(message, "user");


      // Clear input

      input.value = "";


      // Disable send

      sendButton.disabled = true;


      // Show thinking

      const aiMessage = addMessage(
        "Thinking...",
        "ai"
      );


      try {

        const response = await fetch("/chat", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: message
          })

        });


        const data = await response.json();


        if (!response.ok) {

          throw new Error(
            data.error || "Something went wrong"
          );

        }


        // Display AI response

        // aiMessage.textContent = data.reply;
        aiMessage.innerHTML = marked.parse(data.reply);


      } catch (error) {

        console.error(error);

        aiMessage.textContent =
          "Sorry, something went wrong. Please try again.";

      }


      // Enable send

      sendButton.disabled = false;

      input.focus();

    }


    // Send button

    sendButton.addEventListener(
      "click",
      sendMessage
    );


    // Enter key

    input.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Enter") {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    // New chat

    newChatButton.addEventListener(
      "click",
      async () => {

        await fetch("/new-chat", {
          method: "POST"
        });


        messages.innerHTML = `

          <div class="welcome" id="welcome">

            <h3>How can I help you?</h3>

            <p>
              Ask me anything to get started.
            </p>

          </div>

        `;

        input.focus();

      }
    );


    // Focus input when page loads

    input.focus();

  </script>

</body>
</html>
